name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # 1. Crear el archivo .env de forma directa antes de compilar
      - name: Create .env file
        run: |
          echo "VITE_OCR_ENDPOINT=https://tu-url-del-docente-aqui" >> .env
          echo "VITE_SUPABASE_URL=https://tu-url-supabase.supabase.co" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=tu-clave-aqui" >> .env

      # 2. Instalar dependencias y compilar manualmente con Vite
      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build

      # 3. Subir únicamente la carpeta dist ya compilada
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_DUNE_03D408810 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_DUNE_03D408810 }}
          action: "close"
